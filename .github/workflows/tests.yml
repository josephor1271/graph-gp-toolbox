name: CPU tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python experiments/01_heat_hyperparameter_recovery.py --smoke --output results/ci
      - run: python experiments/02_heat_identifiability.py --smoke --output results/ci_identifiability
      - run: python experiments/03_graph_time.py --smoke --output results/ci_graph_time
      - run: python experiments/04_scaling.py --smoke --output results/ci_scaling_stage04
